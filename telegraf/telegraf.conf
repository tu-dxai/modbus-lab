# Cấu hình Telegraf đọc chính simulator của lab này.
# THAM KHẢO — CHƯA CHẠY THỬ. Đối chiếu tên tham số với tài liệu plugin Modbus
# của đúng phiên bản Telegraf bạn cài. Chạy thử một lượt:
#   telegraf --config telegraf/telegraf.conf --test

[agent]
  interval = "5s"
  omit_hostname = true

[[inputs.modbus]]
  name = "dong-ho-dien-01"
  slave_id = 1
  timeout = "1s"
  controller = "tcp://127.0.0.1:5020"
  holding_registers = [
    { name = "dien_ap",     byte_order = "AB",   data_type = "UINT16",       scale = 0.1, address = [0] },
    { name = "dong_dien",   byte_order = "AB",   data_type = "UINT16",       scale = 0.1, address = [1] },
    { name = "cong_suat",   byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [2, 3] },
    { name = "nhiet_do_tu", byte_order = "AB",   data_type = "INT16",        scale = 0.1, address = [4] },
  ]

[[inputs.modbus]]
  name = "bess-01"
  slave_id = 2
  timeout = "1s"
  controller = "tcp://127.0.0.1:5020"
  input_registers = [
    { name = "muc_pin",      byte_order = "CDAB", data_type = "FLOAT32-IEEE", scale = 1.0, address = [100, 101] },
    { name = "nhiet_do_pin", byte_order = "AB",   data_type = "INT16",        scale = 0.1, address = [104] },
  ]
  holding_registers = [
    { name = "che_do", byte_order = "AB", data_type = "UINT16", scale = 1.0, address = [10] },
  ]

[[outputs.file]]
  files = ["stdout"]
