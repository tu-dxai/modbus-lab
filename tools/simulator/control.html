<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c2129; --muted: #6b7280; --line: #e5e7eb;
    --ok: #15803d; --ok-bg: #dcfce7; --err: #b91c1c; --err-bg: #fee2e2;
    --accent: #2563eb; --accent-bg: #dbeafe; --flash: #fef9c3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --card: #181c24; --text: #e5e7eb; --muted: #9ca3af; --line: #2a303b;
      --ok: #4ade80; --ok-bg: #14321f; --err: #f87171; --err-bg: #3b1515;
      --accent: #60a5fa; --accent-bg: #172554; --flash: #3a3410;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
               "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 40px; }
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 6px; }
  header.top h1 { font-size: 20px; margin: 0; margin-right: auto; }
  .lead { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.err { color: var(--err); background: var(--err-bg); }
  .layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card + .card { margin-top: 16px; }
  .card > header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .card h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  .tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; color: var(--accent); background: var(--accent-bg); margin-left: 6px; vertical-align: 1px; }
  .set { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .now { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 18px; min-width: 90px; text-align: right; }
  .unit { color: var(--muted); font-size: 13px; min-width: 24px; }
  input[type=number] { width: 100px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .err-msg { grid-column: 1 / -1; color: var(--err); font-size: 13px; }
  .err-msg:empty { display: none; }
  .log { max-height: 75vh; overflow-y: auto; }
  .w { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .w:last-child { border-bottom: 0; }
  .w .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .w .seq { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  .w .st { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .w .st.ok { color: var(--ok); background: var(--ok-bg); }
  .w .st.err { color: var(--err); background: var(--err-bg); }
  .w .pts { margin-top: 2px; font-variant-numeric: tabular-nums; }
  .w .raw { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  .empty { padding: 20px 16px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-left: auto; }
  .langs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .langs button { border: 0; border-radius: 0; padding: 5px 10px; font-size: 13px; }
  .langs button + button { border-left: 1px solid var(--line); }
  .langs button.on { background: var(--accent); color: #fff; }
  .card > header .meta { flex-basis: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 data-i18n="simui.title">Simulator</h1>
    <span id="conn" class="pill ok" data-i18n="simui.connecting"></span>
    <div class="actions">
      <div class="langs"><button data-lang="vi">Tiếng Việt</button><button data-lang="ja">日本語</button></div>
      <button id="reset" data-i18n="simui.reset" data-i18n-title="simui.reset_hint"></button>
    </div>
  </header>
  <p class="lead" data-i18n="simui.lead"></p>
  <div class="layout">
    <main id="devices"></main>
    <section class="card">
      <header><h2 data-i18n="simui.log_title"></h2><span id="count" class="muted"></span>
        <div class="actions"><button id="clear" data-i18n="simui.clear"></button></div></header>
      <div id="log" class="log"></div>
    </section>
  </div>
</div>

<script src="/i18n.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const rows = {};                         // điểm -> phần tử cần cập nhật
const labels = {};                       // điểm -> nhãn song ngữ, để hiện trong nhật ký lệnh ghi
const deviceLabels = {};                 // thiết bị -> nhãn song ngữ
let built = '';
let lastPoints = null, lastWrites = null, connState = ['ok', 'simui.connecting'];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function api(method, path, body) {
  const res = await fetch(path, { method, cache: 'no-store',
    headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const j = await res.json();
  if (!res.ok) throw new Error(errText(j) || res.status);
  return j;
}

function limits(p) {
  if (p.allowed) return t('simui.allowed', { values: p.allowed });
  if ('min' in p) return t('simui.range', { min: p.min, max: p.max });
  return '';
}

function pointName(key) {
  return tr(labels[key]) || key.split('.').slice(1).join('.');
}

function build(points) {
  const main = $('#devices');
  main.replaceChildren();
  const byDevice = {};
  for (const [key, p] of Object.entries(points)) (byDevice[p.device] ||= []).push([key, p]);
  for (const [dev, list] of Object.entries(byDevice)) {
    const first = list[0][1];
    deviceLabels[dev] = first.device_label;
    const card = el('section', 'card');
    const h = el('header');
    const site = first.site_endpoint !== first.endpoint ? t('simui.site_suffix', { site: first.site_endpoint }) : '';
    h.append(el('h2', '', tr(first.device_label) || dev),
             el('div', 'meta', `${dev} · ` + t('common.device_meta',
               { endpoint: first.endpoint, site, id: first.device_id, order: first.byte_order })));
    card.append(h);
    for (const [key, p] of list) {
      labels[key] = p.label;
      const row = el('div', 'row');
      const info = el('div');
      const name = el('div', 'name', tr(p.label));
      if (p.writable) name.append(el('span', 'tag', t('simui.writable')));
      const lim = limits(p);
      const code = key.split('.').slice(1).join('.');
      info.append(name, el('div', 'meta', `${code} · ${p.table} ${p.address} · ${p.type}${lim ? ' · ' + lim : ''}`));
      const set = el('div', 'set');
      const now = el('span', 'now', '—');
      const unit = el('span', 'unit', p.unit);
      const inp = el('input');
      inp.type = 'number'; inp.step = 'any'; inp.placeholder = t('simui.new_value');
      const btn = el('button', 'primary', t('simui.set'));
      const msg = el('div', 'err-msg');
      const go = () => setValue(key, inp, msg);
      btn.onclick = go;
      inp.onkeydown = (e) => { if (e.key === 'Enter') go(); };
      set.append(now, unit, inp, btn);
      row.append(info, set, msg);
      rows[key] = { row, now };
      card.append(row);
    }
    main.append(card);
  }
}

const fmt = (v) => v === null || v === undefined ? '?' : Number(v).toLocaleString(locale(), { maximumFractionDigits: 3 });

async function setValue(key, inp, msg) {
  if (inp.value === '') return;
  msg.textContent = '';
  try {
    await api('POST', '/api/state', { [key]: Number(inp.value) });
    inp.value = '';
    refresh();
  } catch (e) { msg.textContent = e.message; }
}

let lastValues = {};
function update(points) {
  for (const [key, p] of Object.entries(points)) {
    const r = rows[key];
    if (!r) continue;
    r.now.textContent = fmt(p.value);
    if (key in lastValues && lastValues[key] !== p.value) {
      r.row.classList.remove('flash'); void r.row.offsetWidth; r.row.classList.add('flash');
    }
  }
  lastValues = Object.fromEntries(Object.entries(points).map(([k, p]) => [k, p.value]));
}

function renderLog(writes) {
  $('#count').textContent = writes.length ? t('simui.log_count', { n: writes.length }) : '';
  const log = $('#log');
  if (!writes.length) { log.replaceChildren(el('div', 'empty', t('simui.empty'))); return; }
  log.replaceChildren(...writes.slice().reverse().map(w => {
    const box = el('div', 'w');
    const head = el('div', 'head');
    head.append(el('span', 'seq', `#${w.seq} · ${w.at.slice(11)}`),
                el('span', 'st ' + (w.accepted ? 'ok' : 'err'),
                   w.accepted ? t('simui.accepted') : t('simui.rejected', { code: w.exception })),
                el('span', '', w.device ? (tr(deviceLabels[w.device]) || w.device)
                                        : t('simui.unknown_device', { id: w.device_id })),
                el('span', 'seq', t('simui.target', { endpoint: w.site_endpoint })));
    const pts = el('div', 'pts', w.points.length
      ? w.points.map(p => w.accepted
          ? `${pointName(p.key)}: ${fmt(p.before)} → ${fmt(p.value)}`
          : t('simui.attempt', { name: pointName(p.key), value: fmt(p.value), before: fmt(p.before) })).join(' · ')
      : t('simui.no_point'));
    const raw = el('div', 'raw', t('simui.raw',
      { fc: String(w.function).padStart(2, '0'), address: w.address, registers: w.registers }));
    box.append(head, pts, raw);
    return box;
  }));
}

function setConn(kind, key) {
  connState = [kind, key];
  $('#conn').className = 'pill ' + kind;
  $('#conn').textContent = t(key);
}

let lastLog = '';
function render(force) {
  if (!lastPoints) return;
  const shape = JSON.stringify([I18N.lang, Object.keys(lastPoints)]);
  if (shape !== built) { build(lastPoints); built = shape; }
  update(lastPoints);
  const sig = JSON.stringify([I18N.lang, lastWrites.map(w => w.seq)]);
  if (force || sig !== lastLog) { renderLog(lastWrites); lastLog = sig; }
}

async function refresh() {
  try {
    const [{ points }, { writes }] = await Promise.all([api('GET', '/api/state'), api('GET', '/api/writes')]);
    lastPoints = points; lastWrites = writes;
    render();
    setConn('ok', 'simui.running');
  } catch (e) {
    setConn('err', 'simui.down');
  }
}

$('#reset').onclick = async () => {
  if (!confirm(t('simui.confirm_reset'))) return;
  await api('POST', '/api/reset', {}); refresh();
};
$('#clear').onclick = async () => { await api('DELETE', '/api/writes'); refresh(); };

initI18n(() => {
  document.title = t('simui.title');
  setConn(...connState);
  render(true);
}).then(() => {
  document.title = t('simui.title');
  refresh();
  setInterval(refresh, 1000);
});
</script>
</body>
</html>
