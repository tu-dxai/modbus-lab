<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/ui.css">
<style>
  .reg { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .lim { color: var(--muted); font-size: 12px; white-space: nowrap; }
  td.value-col { width: 1%; white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button id="side-toggle" class="icon-btn" data-icon="sidebar" data-i18n-title="ui.toggle_side"></button>
    <h1 data-i18n="simui.title">Simulator</h1>
    <span class="spacer"></span>
    <span id="conn" class="pill ok" data-i18n="simui.connecting"></span>
    <div class="seg langs"><button data-lang="vi">Tiếng Việt</button><button data-lang="ja">日本語</button></div>
    <button id="reset" class="btn" data-icon="reset" data-i18n-title="simui.reset_hint"><span data-i18n="simui.reset"></span></button>
    <button id="help-open" class="icon-btn" data-icon="help" data-i18n-title="ui.help"></button>
  </header>
  <div class="workspace">
    <aside class="side card">
      <div class="search"><input id="q" class="field" type="search" autocomplete="off" data-i18n-placeholder="ui.search"></div>
      <div id="devlist" class="list"></div>
    </aside>
    <section id="content" class="content">
      <!-- đặt giá trị cho thiết bị giả; lệnh client gửi tới xem ở khung tin trang collector (hoặc make writes) -->
      <div class="panel card" style="flex: 1">
        <div class="panel-head">
          <h2 id="title"></h2><span id="sub" class="sub"></span>
          <div class="tools">
            <span id="power-slot"></span>
            <span class="small muted hide-sm" data-i18n="simui.set_hint"></span>
            <label class="chk small" data-i18n-title="simui.auto_hint"><span data-i18n="simui.auto"></span>
              <select id="auto" class="field"></select></label>
          </div>
        </div>
        <div class="scroll">
          <table class="grid">
            <thead><tr>
              <th data-i18n="ui.col_point"></th>
              <th class="hide-sm" data-i18n="ui.col_register"></th>
              <th class="hide-sm" data-i18n="ui.col_limits"></th>
              <th class="r" data-i18n="ui.col_value"></th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</div>

<div id="help" class="drawer-wrap" hidden>
  <aside class="drawer" role="dialog" aria-modal="true">
    <div class="drawer-head"><h2></h2><button class="icon-btn" data-icon="x" data-i18n-title="ui.close"></button></div>
    <div class="drawer-body"></div>
  </aside>
</div>

<script src="/i18n.js"></script>
<script src="/ui.js"></script>
<script>
let points = null, auto = 0, connState = ['ok', 'simui.connecting'];
const AUTO_CHOICES = [0, 5, 10, 30];
let selected = selectedDevice();
let built = '', lastValues = {};
const rows = {};                         // điểm -> phần tử cần cập nhật
const labels = {};                       // điểm -> nhãn song ngữ
const devices = new Map();               // thiết bị -> { name, label, device_id, byte_order, endpoint, site_endpoint, points }

const fmt = (v) => v === null || v === undefined ? '?' : fmtNum(v, 3);

async function api(method, path, body) {
  const res = await fetch(path, { method, cache: 'no-store',
    headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const j = await res.json();
  if (!res.ok) throw new Error(errText(j) || res.status);
  return j;
}

function pointName(key) {
  return tr(labels[key]) || key.split('.').slice(1).join('.');
}

function deviceName(name) {
  const d = devices.get(name);
  return d ? tr(d.label) || name : name;
}

function siteSuffix(d) {
  return d.site_endpoint !== d.endpoint ? t('simui.site_suffix', { site: d.site_endpoint }) : '';
}

// ---------- thiết bị và điểm đo ----------
function indexDevices(pts) {
  devices.clear();
  for (const [key, p] of Object.entries(pts)) {
    labels[key] = p.label;
    if (!devices.has(p.device)) devices.set(p.device, { name: p.device, label: p.device_label, device_id: p.device_id,
      byte_order: p.byte_order, protocol: p.protocol, meta: p.device_meta,
      endpoint: p.endpoint, site_endpoint: p.site_endpoint, points: [] });
    devices.get(p.device).points.push([key, p]);
  }
}

// ---------- bật / tắt thiết bị (giả lập mất điện) ----------
function deviceOn(name) {
  const p = Object.values(points || {}).find(x => x.device === name);
  return !p || p.on !== false;
}

// Thiết bị tắt phản ứng theo kiểu kết nối, giống sim.py: IP riêng / sau gateway / im lặng (RS-485, SNMP, BACnet).
function offEffect(d) {
  if (d.meta.protocol !== 'modbus' || d.endpoint.startsWith('rtu:')) return t('simui.off_silent');
  const shared = [...devices.values()].filter(x => x.endpoint === d.endpoint).length > 1;
  return t(shared ? 'simui.off_gateway' : 'simui.off_refuse');
}

function powerButton(d) {
  const on = deviceOn(d.name);
  const b = el('button', 'btn sm power' + (on ? '' : ' off'));
  b.append(icon('power'), el('span', '', t(on ? 'simui.power_on' : 'simui.power_off')));
  b.title = on ? t('simui.turn_off_hint', { effect: offEffect(d) }) : t('simui.turn_on_hint');
  b.onclick = async (e) => {
    e.stopPropagation();
    b.disabled = true;
    try { await api('POST', '/api/power', { device: d.name, on: !on }); }
    catch (err) { alert(err.message); }
    refresh();
  };
  return b;
}

function offNote(d) {
  const row = el('tr', 'off-note'), td = el('td', '', t('simui.off_note', { effect: offEffect(d) }));
  td.colSpan = 4;
  row.append(td);
  return row;
}

function limitText(p) {
  if (p.allowed) return t('simui.allowed', { values: p.allowed });
  if ('min' in p) return t('simui.range', { min: p.min, max: p.max });
  return t('simui.new_value');
}

function pointRow(key, p) {
  const row = el('tr');
  const name = el('td', 'label-cell');
  const main = el('div', 'main', tr(p.label));
  if (p.writable) main.append(' ', el('span', 'badge', t('simui.writable')));
  name.append(main, el('div', 'code', key.split('.').slice(1).join('.')));
  const reg = el('td', 'hide-sm reg');
  reg.append(pointRef(p, p.protocol));
  const lim = el('td', 'hide-sm lim', p.allowed || 'min' in p ? limitText(p) : '');
  const value = el('td', 'r value-col');
  const cell = el('span', 'val-cell');
  const num = el('span', 'value', '—');
  const edit = iconButton('pencil', 'ui.edit', 'edit');     // ✎ mở ô nhập ngay tại chỗ; Enter đặt, Esc hủy
  edit.onclick = () => openEditor(value, {
    value: points[key].value, hint: limitText(p), unit: p.unit,
    onSave: v => api('POST', '/api/state', { [key]: v }).then(refresh),
  });
  cell.append(num, edit);
  value.append(cell);
  row.append(name, reg, lim, value);
  if (!deviceOn(p.device)) row.classList.add('off');
  rows[key] = { tr: row, num, unit: p.unit };
  return row;
}

function build() {
  for (const k in rows) delete rows[k];
  const body = $('#rows');
  body.replaceChildren();
  const q = $('#q').value.trim();
  const list = [...devices.values()].filter(d => selected === ALL ? deviceMatches(d, q) : d.name === selected);
  if (selected === ALL) {
    $('#title').textContent = t('ui.all_devices');
    $('#sub').textContent = t('ui.n_points', { n: list.reduce((n, d) => n + d.points.length, 0) });
    for (const d of list) {
      const head = el('tr', 'devrow'), td = el('td', '', tr(d.label) || d.name);
      td.colSpan = 4;
      td.append(el('span', 'meta', `${d.name} · ${d.endpoint}${siteSuffix(d)} · ${deviceShort(d.meta)}`),
                powerButton(d));
      head.append(td);
      body.append(head);
      if (!deviceOn(d.name)) body.append(offNote(d));
      body.append(...d.points.map(([k, p]) => pointRow(k, p)));
    }
    $('#power-slot').replaceChildren();
  } else if (list.length) {
    const d = list[0];
    $('#title').textContent = tr(d.label) || d.name;
    $('#sub').textContent = `${d.name} · ` + deviceMetaText(d, d.meta, siteSuffix(d));
    $('#power-slot').replaceChildren(powerButton(d));
    if (!deviceOn(d.name)) body.append(offNote(d));
    body.append(...d.points.map(([k, p]) => pointRow(k, p)));
  }
  if (!body.children.length) {
    const row = el('tr', 'empty-row'), td = el('td', '', t('ui.no_match'));
    td.colSpan = 4; row.append(td); body.append(row);
  }
}

function sidebar() {
  renderSidebar($('#devlist'), [...devices.values()], {
    selected, query: $('#q').value.trim(),
    allMeta: t('ui.n_points', { n: Object.keys(points || {}).length }),
    itemMeta: d => deviceOn(d.name) ? deviceShort(d.meta) : t('simui.off_short'),
    itemDot: d => deviceOn(d.name) ? 'ok' : 'idle',
    onSelect: name => { selected = name; selectDevice(name); renderPoints(); },
  });
}

function updateValues() {
  for (const [key, p] of Object.entries(points)) {
    const r = rows[key];
    if (!r) continue;
    r.num.replaceChildren(document.createTextNode(fmt(p.value)), el('span', 'unit', r.unit));
    if (key in lastValues && lastValues[key] !== p.value) {
      r.tr.classList.remove('flash'); void r.tr.offsetWidth; r.tr.classList.add('flash');
    }
  }
  lastValues = Object.fromEntries(Object.entries(points).map(([k, p]) => [k, p.value]));
}

function renderPoints() {
  if (!points) return;
  if (selected !== ALL && !devices.has(selected)) selected = ALL;
  const off = Object.values(points).filter(p => p.on === false).map(p => p.device);   // bật/tắt: dựng lại bảng
  const shape = JSON.stringify([I18N.lang, selected, $('#q').value, Object.keys(points), off]);
  if (shape !== built) { build(); built = shape; sidebar(); }
  updateValues();
}

// ---------- vòng cập nhật: hiện giá trị thiết bị đang báo (đổi khi đặt tay, tự thay đổi, hoặc client ghi) ----------
function setConn(kind, key) {
  connState = [kind, key];
  $('#conn').className = 'pill ' + kind;
  $('#conn').textContent = t(key);
}

async function refresh() {
  try {
    const st = await api('GET', '/api/state');
    if (!points || Object.keys(points).join() !== Object.keys(st.points).join()) indexDevices(st.points);
    points = st.points;
    if (st.auto !== auto || $('#auto').value !== String(st.auto)) { auto = st.auto; fillAuto(); }
    renderPoints();
    setConn('ok', 'simui.running');
  } catch (e) {
    setConn('err', 'simui.down');
  }
}

// ---------- tự thay đổi giá trị: 0 = chỉ đặt bằng tay ----------
function fillAuto() {
  const choices = AUTO_CHOICES.includes(auto) ? AUTO_CHOICES : [...AUTO_CHOICES, auto].sort((a, b) => a - b);
  $('#auto').replaceChildren(...choices.map(sec => {
    const o = el('option', '', sec ? t('dash.auto_every', { s: sec }) : t('simui.auto_off'));
    o.value = String(sec);
    return o;
  }));
  $('#auto').value = String(auto);
  $('#auto').classList.toggle('on', auto > 0);
}

$('#auto').onchange = async () => {
  try {
    await api('POST', '/api/auto', { interval: Number($('#auto').value) });
    auto = Number($('#auto').value);
  } catch (e) { /* giữ lựa chọn cũ */ }
  fillAuto();
};
$('#q').oninput = () => { built = ''; renderPoints(); };
$('#reset').onclick = async () => {
  if (!confirm(t('simui.confirm_reset'))) return;
  await api('POST', '/api/reset', {}); refresh();
};
window.onhashchange = () => { selected = selectedDevice(); renderPoints(); };
document.addEventListener('keydown', (e) => {          // phím /: tìm thiết bị
  if (e.key !== '/' || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  e.preventDefault();
  $('#q').focus();
});

initI18n(() => {
  document.title = t('simui.title');
  setConn(...connState);
  built = ''; renderPoints();
  fillAuto();
  if (!$('#help').hidden) renderHelp('sim');
}).then(() => {
  initShell('sim');
  fillAuto();
  document.title = t('simui.title');
  refresh();
  setInterval(refresh, 1000);
});
</script>
</body>
</html>
