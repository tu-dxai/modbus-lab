<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modbus lab</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c2129; --muted: #6b7280; --line: #e5e7eb;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #a16207; --warn-bg: #fef3c7;
    --err: #b91c1c; --err-bg: #fee2e2; --accent: #2563eb; --spark: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --card: #181c24; --text: #e5e7eb; --muted: #9ca3af; --line: #2a303b;
      --ok: #4ade80; --ok-bg: #14321f; --warn: #fbbf24; --warn-bg: #3a2c0b;
      --err: #f87171; --err-bg: #3b1515; --accent: #60a5fa; --spark: #64748b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
               "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 16px; }
  header.top h1 { font-size: 20px; margin: 0; margin-right: auto; }
  header.top h1 .muted { font-weight: 400; margin-left: 6px; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.err { color: var(--err); background: var(--err-bg); }
  .muted { color: var(--muted); font-size: 13px; }
  .langs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .langs button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 13px; }
  .langs button + button { border-left: 1px solid var(--line); }
  .langs button.on { background: var(--accent); color: #fff; }
  #alerts:empty { display: none; }
  #alerts { margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; background: var(--err-bg); color: var(--err); }
  #alerts div + div { margin-top: 4px; }
  #devices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card > header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 4px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.hot { background: var(--err-bg); }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  .val { text-align: right; white-space: nowrap; min-width: 110px; }
  .num { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .unit { color: var(--muted); margin-left: 4px; }
  .row.err .num, .note.err { color: var(--err); }
  .row.hot .num { color: var(--err); }
  .note { grid-column: 1 / -1; font-size: 13px; }
  .note:empty { display: none; }
  svg.spark { width: 110px; height: 30px; }
  svg.spark polyline { fill: none; stroke: var(--spark); stroke-width: 1.5; }
  .row.hot svg.spark polyline { stroke: var(--err); }
  .ctl { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .ctl .lbl { color: var(--muted); font-size: 13px; margin-right: 4px; }
  button, input { font: inherit; }
  button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: wait; }
  input[type=number] { width: 110px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  footer { margin-top: 20px; }
  a { color: var(--accent); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px);
           padding: 10px 16px; border-radius: 10px; font-weight: 500; box-shadow: 0 4px 20px rgba(0,0,0,.2); display: none; }
  #toast.ok { display: block; color: var(--ok); background: var(--ok-bg); }
  #toast.err { display: block; color: var(--err); background: var(--err-bg); }
  @media (max-width: 480px) {
    svg.spark { display: none; }
    .row { grid-template-columns: 1fr auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span data-i18n="dash.title">Modbus lab</span><span id="site" class="muted"></span></h1>
    <span id="conn" class="pill warn" data-i18n="dash.loading"></span>
    <span id="info" class="muted"></span>
    <div class="langs"><button data-lang="vi">Tiếng Việt</button><button data-lang="ja">日本語</button></div>
  </header>
  <div id="alerts"></div>
  <main id="devices"></main>
  <footer class="muted"><span data-i18n="dash.footer"></span>
    JSON: <a href="/api/points">/api/points</a></footer>
</div>
<div id="toast"></div>

<script src="/i18n.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const SVG = 'http://www.w3.org/2000/svg';
let built = '';                       // mô tả thiết bị + ngôn ngữ lần dựng trước; đổi thì dựng lại
let last = null;                      // số liệu lần tải gần nhất, để vẽ lại ngay khi đổi ngôn ngữ
let connState = null;                 // trạng thái kết nối, để dịch lại khi đổi ngôn ngữ
const rows = {};                      // điểm -> các phần tử cần cập nhật
const labels = {};                    // điểm -> nhãn song ngữ

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const fmt = (v) => Number(v).toLocaleString(locale(), { maximumFractionDigits: 2 });

function rulesText(rules, key) {
  return rules.filter(a => a.point === key)
    .map(a => 'above' in a ? t('dash.threshold_above', { value: a.above }) : t('dash.threshold_below', { value: a.below }))
    .join(', ');
}

function build(s) {
  const main = $('#devices');
  main.replaceChildren();
  for (const k in rows) delete rows[k];
  for (const d of s.devices) {
    const card = el('section', 'card');
    const h = el('header');
    const site = d.site_endpoint !== d.endpoint ? t('dash.site_suffix', { site: d.site_endpoint }) : '';
    h.append(el('h2', '', tr(d.label)),
             el('div', 'meta', `${d.name} · ` + t('common.device_meta',
               { endpoint: d.endpoint, site, id: d.device_id, order: d.byte_order })));
    card.append(h);
    for (const p of d.points) {
      labels[p.key] = p.label;
      const row = el('div', 'row');
      const info = el('div');
      const rule = rulesText(s.alert_rules, p.key);
      info.append(el('div', 'name', tr(p.label)),
                  el('div', 'meta', `${p.name} · ${p.table} ${p.address} · ${p.type}${rule ? ' · ' + rule : ''}`));
      const spark = document.createElementNS(SVG, 'svg');
      spark.setAttribute('class', 'spark');
      spark.setAttribute('viewBox', '0 0 110 30');
      spark.setAttribute('preserveAspectRatio', 'none');
      const line = document.createElementNS(SVG, 'polyline');
      spark.append(line);
      const val = el('div', 'val');
      const num = el('span', 'num', '—');
      val.append(num, el('span', 'unit', p.unit));
      const note = el('div', 'note');
      row.append(info, spark, val, note);
      const r = { row, num, note, line, buttons: [] };
      if (p.writable) row.append(controls(p, r));
      rows[p.key] = r;
      card.append(row);
    }
    main.append(card);
  }
}

function controls(p, r) {
  const ctl = el('div', 'ctl');
  ctl.append(el('span', 'lbl', t('dash.write_label')));
  if (p.allowed) {
    for (const v of p.allowed) {
      const b = el('button', '', String(v));
      b.dataset.v = v;
      b.onclick = () => write(p.key, v, r.buttons);
      r.buttons.push(b);
      ctl.append(b);
    }
  } else {
    const inp = el('input');
    inp.type = 'number'; inp.step = 'any';
    const b = el('button', '', t('dash.write_button'));
    b.onclick = () => inp.value !== '' && write(p.key, Number(inp.value), [b]);
    r.buttons.push(b);
    ctl.append(inp, b);
  }
  return ctl;
}

function sparkPoints(vals) {
  const v = vals.filter(x => x !== null);
  if (v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const step = 110 / (vals.length - 1);
  return vals.map((x, i) => x === null ? null : `${(i * step).toFixed(1)},${(27 - (x - lo) / span * 24).toFixed(1)}`)
             .filter(Boolean).join(' ');
}

function setConn(kind, key) {
  connState = [kind, key];
  const conn = $('#conn');
  conn.className = 'pill ' + kind;
  conn.textContent = t(key);
}

function update(s) {
  const firing = new Map(s.alert_rules.filter(a => a.firing).map(a => [a.point, a]));
  let ok = 0, total = 0;
  for (const [key, r] of Object.entries(rows)) {
    const p = s.points[key];
    total++;
    if (p && p.ok) ok++;
    r.num.textContent = !p ? '—' : p.ok ? fmt(p.value) : t('common.error');
    r.row.classList.toggle('err', !!p && !p.ok);
    r.row.classList.toggle('hot', firing.has(key));
    if (p && !p.ok) { r.note.textContent = errText(p); r.note.className = 'note err'; }
    else if (firing.has(key)) { r.note.textContent = '⚠ ' + tr(firing.get(key).message); r.note.className = 'note err'; }
    else r.note.textContent = '';
    r.line.setAttribute('points', sparkPoints(s.history[key] || []));
    for (const b of r.buttons) if (b.dataset.v !== undefined)
      b.classList.toggle('on', !!p && p.ok && Number(b.dataset.v) === p.value);
  }

  $('#alerts').replaceChildren(...[...firing.values()].map(a => {
    const p = s.points[a.point];
    return el('div', '', `⚠ ${tr(a.message)} — ${tr(labels[a.point]) || a.point} = ${fmt(p.value)} ${p.unit}`);
  }));

  if (total && ok === total) setConn('ok', 'dash.status_ok');
  else if (ok > 0) setConn('warn', 'dash.status_partial');
  else setConn('err', s.status.round ? 'dash.status_down' : 'dash.status_waiting');
  $('#site').textContent = s.site ? t('dash.site', { site: s.site, env: s.env }) : '';
  $('#info').textContent = s.status.round
    ? t('dash.round', { round: s.status.round, at: s.status.at, ok, total }) : '';
}

function render() {
  if (!last) return;
  const shape = JSON.stringify([I18N.lang, last.devices, last.alert_rules.map(a => [a.point, a.above, a.below])]);
  if (shape !== built) { build(last); built = shape; }
  update(last);
}

async function load() {
  try {
    const res = await fetch('/api/points', { cache: 'no-store' });
    last = await res.json();
    render();
  } catch (e) {
    setConn('err', 'dash.status_no_collector');
  }
  setTimeout(load, 2000);
}

let toastTimer;
function toast(msg, kind) {
  const box = $('#toast');
  box.textContent = msg;
  box.className = kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.className = ''; }, 5000);
}

async function write(key, value, buttons) {
  const point = tr(labels[key]) ? `${tr(labels[key])} (${key})` : key;
  if (!confirm(t('dash.confirm_write', { point, value }))) return;
  buttons.forEach(b => b.disabled = true);
  try {
    const res = await fetch('/api/write', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ point: key, value }),
    });
    const j = await res.json();
    if (j.ok) toast(t('dash.write_ok', { point, before: fmt(j.before), after: fmt(j.after) }), 'ok');
    else toast(t(j.blocked ? 'dash.blocked' : 'dash.failed', { reason: errText(j) }), 'err');
  } catch (e) {
    toast(t('dash.status_no_collector'), 'err');
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

initI18n(() => {
  document.title = t('dash.title');
  if (connState) setConn(...connState);
  render();
}).then(() => {
  document.title = t('dash.title');
  load();
});
</script>
</body>
</html>
