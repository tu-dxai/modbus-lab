# ---------- khung hướng dẫn cho người mới (nút ?, tự hiện lần đầu mở trang) ----------
help.steps:              { vi: "Thao tác",            ja: "操作手順" }
help.terms:              { vi: "Thuật ngữ Modbus, SNMP, BACnet", ja: "Modbus・SNMP・BACnet の用語" }
help.systems:            { vi: "Các hệ thống trong data center", ja: "データセンターのシステム" }
help.systems_intro:      { vi: "Data center cần ba thứ để máy chủ chạy: điện, làm mát, và người vận hành biết chuyện gì đang xảy ra. Mỗi hệ thống dưới đây lo một phần; tab Sơ đồ kiến trúc cho thấy chúng nối với nhau thế nào.",
                           ja: "サーバーを動かすには、電力・冷却、そして運用者が状況を把握できることの 3 つが必要です。以下の各システムがその一部を担い、アーキテクチャ図でつながりを確認できます。" }
help.sys_term_epms:      { vi: "EPMS",                ja: "EPMS" }
help.sys_def_epms:       { vi: "Electrical Power Monitoring System — hệ thống giám sát điện năng. Đo điện ở mọi chặng: lưới vào, tủ phân phối, UPS, pin, tới từng rack (điện áp, dòng, công suất, điện năng, chất lượng điện). Trả lời: điện có đủ, ổn định, còn dự phòng bao lâu? Trong lab: 3 đồng hồ điện, BESS, UPS.",
                           ja: "Electrical Power Monitoring System — 電力監視システム。受電・分電盤・UPS・蓄電池から各ラックまで、各段階の電力（電圧・電流・電力・電力量・電力品質）を計測します。電力は足りているか、安定しているか、バックアップはあとどれくらいか？ ラボでは電力計 3 台、BESS、UPS。" }
help.sys_term_bms:       { vi: "BMS",                 ja: "BMS" }
help.sys_def_bms:        { vi: "Building Management System — hệ thống quản lý tòa nhà. Điều khiển và theo dõi môi trường: điều hòa, nhiệt độ, độ ẩm, quạt (tòa nhà lớn còn có chiếu sáng, báo cháy, ra vào). Khác EPMS ở chỗ BMS thường ra lệnh cho thiết bị, không chỉ đo. Thường nói BACnet. Trong lab: điều hòa CRAH 01.",
                           ja: "Building Management System — ビル管理システム。空調・温度・湿度・ファンなどの環境を制御・監視します（大規模ビルでは照明・火災報知・入退室も）。EPMS と違い、計測だけでなく機器へ指令を出すのが普通です。多くは BACnet を使います。ラボでは空調機 CRAH 01。" }
help.sys_term_dcim:      { vi: "DCIM",                ja: "DCIM" }
help.sys_def_dcim:       { vi: "Data Center Infrastructure Management — phần mềm gom số liệu EPMS, BMS (và thiết bị IT) của mọi container về một nơi: giám sát, cảnh báo, công suất còn trống, hiệu suất năng lượng (PUE). Dự án này: Rails + Nuxt trên AWS Tokyo — chưa có trong repo.",
                           ja: "Data Center Infrastructure Management — 全コンテナの EPMS・BMS（と IT 機器）のデータを 1 か所に集め、監視・アラート・空き容量・エネルギー効率（PUE）を扱うソフトウェア。本プロジェクトでは AWS 東京の Rails + Nuxt — リポジトリにはまだありません。" }
help.sys_term_itsm:      { vi: "ITSM",                ja: "ITSM" }
help.sys_def_itsm:       { vi: "IT Service Management — quy trình vận hành: sự cố (incident), yêu cầu, thay đổi, có phiếu (ticket) và người chịu trách nhiệm. Cảnh báo từ DCIM thành phiếu giao cho người trực. Chưa có trong repo.",
                           ja: "IT Service Management — インシデント・要求・変更をチケットと担当者で管理する運用プロセス。DCIM のアラートがチケットになり当番者に割り当てられます。リポジトリにはまだありません。" }
help.sys_term_edge:      { vi: "Edge",                ja: "エッジ" }
help.sys_def_edge:       { vi: "Máy tính đặt ngay trong container: đọc mọi thiết bị (Telegraf, collector BACnet), cảnh báo tại chỗ, ghi lệnh qua rào chắn, rồi gửi lên DCIM qua MQTT. Vẫn chạy khi mất mạng ra ngoài (WAN), nên an toàn không phụ thuộc trung tâm.",
                           ja: "コンテナ内に置くコンピューター。全機器を読み取り（Telegraf、BACnet コレクター）、現地でアラートを出し、ガード経由で指令を書き込み、MQTT で DCIM へ送ります。WAN が切れても動作するため、安全性は中央に依存しません。" }
help.sys_term_ups:       { vi: "UPS",                 ja: "UPS" }
help.sys_def_ups:        { vi: "Bộ lưu điện: mất điện lưới thì cấp điện từ ắc quy ngay lập tức, không gián đoạn, đủ thời gian để máy phát hoặc BESS vào thay. Nguồn ra = 5 nghĩa là UPS đang chạy bằng pin.",
                           ja: "無停電電源装置：商用電源が途絶えると瞬時にバッテリーから給電し、発電機や BESS へ切り替える時間を稼ぎます。出力電源 = 5 はバッテリー運転中を意味します。" }
help.sys_term_bess:      { vi: "BESS",                ja: "BESS" }
help.sys_def_bess:       { vi: "Battery Energy Storage System — hệ pin lưu trữ lớn: sạc khi điện rẻ, xả khi thiếu điện hoặc giờ cao điểm, dự phòng dài hơn UPS. Mức pin (SOC) tính bằng %.",
                           ja: "Battery Energy Storage System — 大型蓄電システム：電力が安いときに充電し、不足時やピーク時に放電。UPS より長時間のバックアップ。充電率（SOC）は %。" }
help.sys_term_crah:      { vi: "CRAH",                ja: "CRAH" }
help.sys_def_crah:       { vi: "Computer Room Air Handler — điều hòa chính xác cho phòng máy: thổi gió lạnh vào mặt trước rack, hút gió nóng phía sau. Nhiệt độ gió cấp nên dưới 27 °C (khuyến nghị ASHRAE).",
                           ja: "Computer Room Air Handler — サーバールーム用の精密空調：ラック前面に冷気を送り、背面の暖気を吸い込みます。給気温度は 27 °C 未満が推奨（ASHRAE）。" }
help.sys_term_pdu:       { vi: "Tủ phân phối / PDU",  ja: "分電盤／PDU" }
help.sys_def_pdu:        { vi: "Tủ chia điện ra nhiều nhánh, có aptomat bảo vệ. PDU (Power Distribution Unit) là tủ hoặc thanh cấp điện tới từng rack. Đồng hồ điện gắn ở tủ để đo nhánh đó.",
                           ja: "電力を複数の系統に分け、ブレーカーで保護する盤。PDU（Power Distribution Unit）は各ラックへ給電する盤またはタップ。盤に付けた電力計でその系統を計測します。" }
help.sys_term_single_line: { vi: "Sơ đồ đơn tuyến",   ja: "単線結線図" }
help.sys_def_single_line: { vi: "Bản vẽ đường điện, mỗi đường dây vẽ bằng một nét: điện đi từ đâu, qua tủ nào, tới tải nào. Dùng để biết mất một phần tử thì những gì bị ảnh hưởng. Bản trong lab là giả định.",
                           ja: "各配線を 1 本の線で描いた電気系統図：電力がどこから、どの盤を通り、どの負荷へ行くか。ある機器が止まると何が影響を受けるかを知るために使います。ラボの図は仮定です。" }
help.keys:               { vi: "Phím tắt",            ja: "ショートカット" }
help.sim_title:          { vi: "Hướng dẫn nhanh — Simulator", ja: "クイックガイド — シミュレーター" }
help.sim_intro:          { vi: "Trang này là thiết bị giả. Bạn quyết định thiết bị báo giá trị gì; client (trang collector hoặc dự án edge của bạn) đọc qua Modbus sẽ thấy đúng giá trị đó.",
                           ja: "このページは模擬機器です。機器が返す値をここで決めます。Modbus で読み取るクライアント（コレクターや開発中のエッジ）には、その値がそのまま見えます。" }
help.sim_step1:          { vi: "Chọn thiết bị ở cột trái, hoặc \"Tất cả thiết bị\". Nút ☰ trên cùng để thu gọn hoặc mở lại cột này.",
                           ja: "左の一覧で機器（または「すべての機器」）を選びます。上部の ☰ で一覧を折りたたみ／再表示できます。" }
help.sim_step2:          { vi: "Bấm ✎ cạnh giá trị, nhập số theo đơn vị kỹ thuật (V, A, °C…) rồi Enter để đặt; Esc để hủy.",
                           ja: "値の横の ✎ を押し、工学単位（V、A、°C など）で数値を入力して Enter で設定、Esc で取り消します。" }
help.sim_step3:          { vi: "Muốn giá trị tự dao động như thiết bị thật, chọn Tự thay đổi 5 / 10 / 30 giây. Chọn Tắt thì giá trị đứng yên.",
                           ja: "実機のように値を変動させるには「自動変化」で 5／10／30 秒を選びます。オフにすると値は固定されます。" }
help.sim_step4:          { vi: "Mở trang collector (mặc định cổng 8080) để đọc thử và xem từng byte gửi và nhận.",
                           ja: "コレクターのページ（既定はポート 8080）で読み取りを試し、送受信のバイト列を確認します。" }
help.sim_keys:           { vi: "/ tìm thiết bị · [ thu/mở danh sách · ? hướng dẫn · Enter lưu · Esc hủy",
                           ja: "/ 機器を検索 · [ 一覧の表示切替 · ? ガイド · Enter 保存 · Esc 取消" }
help.dash_title:         { vi: "Hướng dẫn nhanh — Bảng số liệu", ja: "クイックガイド — 計測値モニター" }
help.dash_intro:         { vi: "Trang này là client, giống edge: gửi yêu cầu Modbus tới thiết bị và hiện kết quả. Trang không tự đọc — mỗi lần bấm là đúng một lượt yêu cầu.",
                           ja: "このページはエッジと同じクライアントです。機器に Modbus 要求を送り、結果を表示します。自動では読み取らず、押すたびに 1 回だけ要求します。" }
help.dash_step1:         { vi: "Chọn thiết bị ở cột trái (chấm xanh: bình thường, vàng: lỗi đọc, đỏ: có cảnh báo). Nút ☰ để thu/mở cột.",
                           ja: "左の一覧で機器を選びます（緑：正常、黄：読み取りエラー、赤：警報あり）。☰ で一覧を折りたたみます。" }
help.dash_step2:         { vi: "Bấm \"Đọc\" (phím R) để đọc thiết bị đang chọn; icon ⟳ trên từng dòng đọc riêng một điểm.",
                           ja: "「読み取り」（R キー）で選択中の機器を読み取ります。各行の ⟳ はその計測点だけを読み取ります。" }
help.dash_step3:         { vi: "Điểm ghi được có icon ✎: bấm để chọn giá trị; lệnh ghi đi qua rào chắn và được đọc lại xác nhận.",
                           ja: "書き込み可能な計測点には ✎ があります。押して値を選ぶと、ガード経由で書き込み、読み戻して確認します。" }
help.dash_step4:         { vi: "Thẻ Khung tin bên dưới: mỗi dòng là một cặp hỏi/đáp; bấm một dòng để xem từng byte và cách giải mã.",
                           ja: "下の「Modbus フレーム」は 1 行が要求と応答の 1 組です。行を押すとバイト列と解読内容を表示します。" }
help.dash_keys:          { vi: "R đọc · / tìm thiết bị · [ thu/mở danh sách · ? hướng dẫn · Enter lưu · Esc hủy",
                           ja: "R 読み取り · / 機器を検索 · [ 一覧の表示切替 · ? ガイド · Enter 保存 · Esc 取消" }
help.term_hr:            { vi: "HR",                  ja: "HR" }
help.def_hr:             { vi: "Holding Register — thanh ghi đọc và ghi được (FC03 đọc, FC06/FC16 ghi). Thường là cài đặt, lệnh điều khiển; một số hãng đặt cả số đo ở đây.",
                           ja: "保持レジスタ — 読み書き可能（FC03 で読み出し、FC06／FC16 で書き込み）。主に設定値や制御指令。計測値を置くメーカーもあります。" }
help.term_ir:            { vi: "IR",                  ja: "IR" }
help.def_ir:             { vi: "Input Register — thanh ghi chỉ đọc (FC04), thường là số đo. HR 100 và IR 100 là hai ô khác nhau.",
                           ja: "入力レジスタ — 読み出し専用（FC04）、主に計測値。HR 100 と IR 100 は別のアドレスです。" }
help.term_fc:            { vi: "FC",                  ja: "FC" }
help.def_fc:             { vi: "Mã lệnh Modbus: 03 đọc HR · 04 đọc IR · 06 ghi một HR · 16 ghi nhiều HR. Thiết bị từ chối thì trả mã lệnh + 0x80 kèm mã lỗi (ví dụ 83 02).",
                           ja: "Modbus の機能コード：03 HR 読み出し · 04 IR 読み出し · 06 HR 1 個書き込み · 16 HR 複数書き込み。拒否時は機能コード＋0x80 と例外コード（例：83 02）。" }
help.term_unit:          { vi: "Unit ID",             ja: "Unit ID" }
help.def_unit:           { vi: "Số hiệu thiết bị (device_id). Sau một gateway RS-485, mỗi thiết bị có một số riêng từ 1 đến 247.",
                           ja: "機器番号（device_id）。RS-485 ゲートウェイ配下では機器ごとに 1～247 の番号を持ちます。" }
help.term_order:         { vi: "Byte order",          ja: "バイト順" }
help.def_order:          { vi: "Thứ tự 4 byte của số 32 bit (ABCD, CDAB, BADC, DCBA). Cấu hình sai thì đọc ra số vô nghĩa mà không có lỗi nào.",
                           ja: "32 ビット値の 4 バイトの並び（ABCD、CDAB、BADC、DCBA）。設定を誤るとエラーなしで無意味な値になります。" }
help.term_scale:         { vi: "Hệ số",               ja: "係数" }
help.def_scale:          { vi: "Giá trị thật = số nguyên trong thanh ghi × hệ số. Ví dụ 2305 × 0.1 = 230,5 V.",
                           ja: "実際の値 ＝ レジスタの整数 × 係数。例：2305 × 0.1 ＝ 230.5 V。" }
help.term_oid:           { vi: "SNMP / OID",          ja: "SNMP／OID" }
help.def_oid:            { vi: "UPS, PDU thường đọc qua SNMP (UDP 161). Mỗi giá trị có một OID, ví dụ UPS-MIB 1.3.6.1.2.1.33. Chỉ đọc.",
                           ja: "UPS や PDU は SNMP（UDP 161）で読むことが多い。値ごとに OID があります（例：UPS-MIB 1.3.6.1.2.1.33）。読み出し専用。" }
help.term_priority:      { vi: "BACnet / mức ưu tiên", ja: "BACnet／優先度" }
help.def_priority:       { vi: "Điều hòa, BMS dùng BACnet/IP (UDP 47808). Lệnh ghi kèm mức ưu tiên 1–16; lệnh ưu tiên cao nhất thắng. Nhả lệnh (relinquish) để trả quyền lại; không ai ra lệnh thì thiết bị dùng giá trị mặc định — giá trị đặt trên trang simulator.",
                           ja: "空調や BMS は BACnet/IP（UDP 47808）を使います。書き込みには優先度 1～16 を付け、最も高い優先度の指令が有効です。解除（relinquish）で権限を戻し、指令がなければ機器は既定値（シミュレーター画面で設定する値）を使います。" }
help.term_gateway:       { vi: "Gateway",             ja: "ゲートウェイ" }
help.def_gateway:        { vi: "Thiết bị chuyển Modbus TCP sang RS-485. Nhiều thiết bị phía sau dùng chung một địa chỉ IP, phân biệt bằng Unit ID.",
                           ja: "Modbus TCP を RS-485 に変換する機器。配下の複数機器は同じ IP を共有し、Unit ID で区別します。" }

