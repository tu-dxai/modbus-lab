                           ja: "{hex}（{type}、バイト順 {order}）→ {name} = {value} {unit}" }
frame.explain_snmp:      { vi: "{hex} = {raw} ({type}) × {scale} → {name} = {value} {unit}",
                           ja: "{hex} = {raw}（{type}）× {scale} → {name} = {value} {unit}" }
frame.explain_bacnet:    { vi: "{hex} = {raw} ({type}) → {name} = {value} {unit}",
                           ja: "{hex} = {raw}（{type}）→ {name} = {value} {unit}" }

# Trang điều khiển: khu khung tin. "Gửi/Nhận" nhìn từ phía client, giống công cụ Modbus thông dụng.
frames.hint:             { vi: "Từng byte trên đường truyền, trước khi giải mã. Gửi: collector gửi tới thiết bị · Nhận: thiết bị trả về collector.",
