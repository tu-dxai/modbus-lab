# =============================================================
#  TỪ ĐIỂN SONG NGỮ vi / ja — mọi chữ trên hai trang web và mọi thông báo lỗi trang web hiển thị
#
#  - Mỗi khóa có đủ vi và ja; {tên} là chỗ điền giá trị, hai ngôn ngữ phải dùng cùng các {tên}.
#    `make test` kiểm tra cả hai điều này, và kiểm tra mọi khóa trang web/code dùng đều có ở đây.
#  - Nhãn thiết bị, điểm đo và câu cảnh báo nằm trong Point Map (edge/point-map/devices.yml).
#  - `make i18n-export` xuất toàn bộ cặp vi/ja (từ điển + Point Map) ra bảng TSV để duyệt.
#
#  Bản tiếng Nhật CẦN NGƯỜI NHẬT DUYỆT trước khi dùng chính thức. Thuật ngữ cần xác nhận:
#    rào chắn (lớp chặn lệnh ghi)  -> ガード           thay thế khả dĩ: 書き込みガード / インターロック
#    điểm đo (point)               -> 計測点           thay thế khả dĩ: ポイント / 監視点
#    nhật ký lệnh ghi              -> 書き込みログ
#    holding register              -> 保持レジスタ
#    mã lỗi Modbus (exception)     -> 例外コード
#    đọc lại xác nhận              -> 読み戻し確認
#    simulator / collector         -> シミュレーター / コレクター
#    môi trường lab / site         -> 環境 lab / site (giữ nguyên tên môi trường)
# =============================================================

