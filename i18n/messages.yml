# Sự cố chỉ phía client thấy: gửi đi mà không có phản hồi.
frame.status.timeout:    { vi: "không có phản hồi sau {s} giây", ja: "{s} 秒以内に応答がありません" }

# Giải nghĩa: từ byte thô tới giá trị của điểm đo.
frame.explain_16:        { vi: "{hex} = {raw} (×{scale}) → {name} = {value} {unit}",
                           ja: "{hex} = {raw}（×{scale}）→ {name} = {value} {unit}" }
