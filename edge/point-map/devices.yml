# =============================================================
#  POINT MAP — mô tả mọi thiết bị và điểm đo của site
#  Simulator dùng file này để giả lập; collector và write-service dùng để đọc, ghi.
#  Thêm thiết bị mới = thêm một khối, không sửa code.
#  label / message: tên hiển thị song ngữ vi và ja, bắt buộc cho mọi thiết bị, điểm và cảnh báo.
#  sim: chỉ simulator dùng — base = giá trị khởi đầu; noise = biên độ dao động khi bật tự thay đổi giá trị.
#
#  Địa chỉ ở đây là địa chỉ THẬT tại site. Khi chạy lab (mặc định --env lab), từng địa chỉ
#  được ánh xạ sang simulator theo environments/lab.yml; chỉ --env site mới kết nối địa chỉ thật.
#
#  Thiết bị trùng host:port = cùng nằm sau một gateway (Modbus TCP -> RS-485):
#    - dùng chung một kết nối TCP (nhiều gateway chỉ cho 1-4 kết nối cùng lúc)
#    - device_id không được trùng trong cùng host:port, và phải trong 1-247 (địa chỉ RTU trên bus)
#    - timeout phải giống nhau (cùng một đường truyền)
#
#  IP 10.20.0.x dưới đây là VÍ DỤ — thay bằng IP thật khi có sơ đồ mạng site.
# =============================================================
site: container-01

# Địa chỉ của edge trên mạng BACnet/IP (IP/mặt nạ:cổng) — client BACnet của collector gửi đi từ đây.
# VÍ DỤ — thay bằng IP thật của edge. Môi trường lab ghi đè bằng bacnet_client trong environments/lab.yml.
bacnet: { client: "10.20.0.5/24:47808" }

devices:
  - name: dong-ho-dien-01          # đồng hồ điện tủ phân phối, sau gateway RS-485
    label: { vi: "Đồng hồ điện tủ phân phối 01", ja: "分電盤 電力計 01" }
    system: EPMS                   # EPMS: hệ thống quản lý điện năng
    host: 10.20.0.21               # IP của gateway (thiết bị RS-485 không có IP riêng)
    port: 502                      # cổng chuẩn Modbus TCP
    device_id: 1                   # địa chỉ RTU trên bus — tra màn hình cài đặt thiết bị
    byte_order: ABCD               # tra tài liệu hãng, KHÔNG đoán
    timeout: 3                     # giây; thiết bị thật chậm hơn simulator
    points:
      - { name: dien_ap,     label: { vi: "Điện áp",           ja: "電圧" },
          table: holding, address: 0, type: uint16,  scale: 0.1, unit: "V",  sim: { base: 230.0, noise: 1.5 } }
      - { name: dong_dien,   label: { vi: "Dòng điện",         ja: "電流" },
          table: holding, address: 1, type: uint16,  scale: 0.1, unit: "A",  sim: { base: 12.0,  noise: 0.8 } }
      - { name: cong_suat,   label: { vi: "Công suất",         ja: "電力" },
          table: holding, address: 2, type: float32, scale: 1,   unit: "W",  sim: { base: 2800,  noise: 60 } }
      - { name: nhiet_do_tu, label: { vi: "Nhiệt độ trong tủ", ja: "盤内温度" },
          table: holding, address: 4, type: int16,   scale: 0.1, unit: "°C", sim: { base: 26.0,  noise: 0.3 } }

  - name: dong-ho-dien-02          # đồng hồ điện thứ hai, cùng bus RS-485 với dong-ho-dien-01
    label: { vi: "Đồng hồ điện tủ phân phối 02", ja: "分電盤 電力計 02" }
    system: EPMS                   # EPMS: hệ thống quản lý điện năng
    host: 10.20.0.21
    port: 502
    device_id: 2
    byte_order: ABCD
    timeout: 3
    points:
      - { name: dien_ap,     label: { vi: "Điện áp",           ja: "電圧" },
          table: holding, address: 0, type: uint16,  scale: 0.1, unit: "V",  sim: { base: 229.0, noise: 1.5 } }
      - { name: dong_dien,   label: { vi: "Dòng điện",         ja: "電流" },
          table: holding, address: 1, type: uint16,  scale: 0.1, unit: "A",  sim: { base: 8.5,   noise: 0.6 } }
      - { name: cong_suat,   label: { vi: "Công suất",         ja: "電力" },
          table: holding, address: 2, type: float32, scale: 1,   unit: "W",  sim: { base: 1950,  noise: 45 } }
      - { name: nhiet_do_tu, label: { vi: "Nhiệt độ trong tủ", ja: "盤内温度" },
          table: holding, address: 4, type: int16,   scale: 0.1, unit: "°C", sim: { base: 25.0,  noise: 0.3 } }

  - name: dong-ho-rs485-03         # đồng hồ nối thẳng RS-485 vào edge (cổng USB-RS485), không qua gateway
    label: { vi: "Đồng hồ điện tủ phụ 03 (RS-485)", ja: "副分電盤 電力計 03（RS-485）" }
    system: EPMS                   # EPMS: hệ thống quản lý điện năng
    transport: rtu                 # Modbus RTU trên cổng serial; không có host/port
    serial: { port: /dev/ttyUSB0, baudrate: 9600, parity: N, stop_bits: 1 }   # tra màn hình cài đặt thiết bị
    device_id: 3                   # địa chỉ RTU trên bus, 1-247
    byte_order: ABCD
    timeout: 1                     # RS-485 9600 baud: một lệnh đọc ngắn mất vài chục ms
    points:
      - { name: dien_ap,     label: { vi: "Điện áp",           ja: "電圧" },
          table: holding, address: 0, type: uint16,  scale: 0.1, unit: "V",  sim: { base: 231.0, noise: 1.5 } }
      - { name: dong_dien,   label: { vi: "Dòng điện",         ja: "電流" },
          table: holding, address: 1, type: uint16,  scale: 0.1, unit: "A",  sim: { base: 5.2,   noise: 0.4 } }
      - { name: nhiet_do_tu, label: { vi: "Nhiệt độ trong tủ", ja: "盤内温度" },
          table: holding, address: 4, type: int16,   scale: 0.1, unit: "°C", sim: { base: 24.0,  noise: 0.3 } }
      - { name: che_do_dem,  label: { vi: "Chế độ đếm điện năng", ja: "電力量の計量モード" },
          table: holding, address: 10, type: uint16, scale: 1,   unit: "",
          writable: true, allowed: [0, 1], sim: { base: 0 } }

  - name: bess-01                  # pin lưu trữ, có cổng Ethernet riêng; hãng này đảo thứ tự word
    label: { vi: "Hệ thống pin lưu trữ 01", ja: "蓄電システム 01" }
    system: EPMS                   # EPMS: hệ thống quản lý điện năng
    host: 10.20.0.30
    port: 502
    device_id: 1                   # thiết bị TCP trực tiếp thường dùng 1 (hoặc 255)
    byte_order: CDAB
    timeout: 3
    points:
      - { name: muc_pin,      label: { vi: "Mức pin (SOC)",   ja: "充電率（SOC）" },
          table: input,   address: 100, type: float32, scale: 1,   unit: "%",  sim: { base: 80.0, noise: 0.2 } }
      - { name: nhiet_do_pin, label: { vi: "Nhiệt độ pin",    ja: "電池温度" },
          table: input,   address: 104, type: int16,   scale: 0.1, unit: "°C", sim: { base: -2.0, noise: 0.4 } }
      - { name: che_do,       label: { vi: "Chế độ vận hành", ja: "運転モード" },
          table: holding, address: 10,  type: uint16,  scale: 1,   unit: "",
          writable: true, allowed: [0, 1], sim: { base: 0 } }

  - name: ups-01                   # UPS có card mạng SNMP; OID theo UPS-MIB chuẩn (RFC 1628)
    label: { vi: "UPS 01", ja: "UPS 01" }
    system: EPMS                   # EPMS: hệ thống quản lý điện năng
    protocol: snmp                 # đọc bằng SNMP GET (Telegraf inputs.snmp ở edge); chỉ đọc
    host: 10.20.0.40
    port: 161                      # cổng chuẩn SNMP (UDP)
    snmp: { version: 2c, community: public }   # tra cấu hình card mạng UPS; đổi community mặc định ở site thật
    timeout: 2
    points:
      - { name: trang_thai_pin, label: { vi: "Trạng thái pin (2 = bình thường)", ja: "バッテリー状態（2 = 正常）" },
          oid: 1.3.6.1.2.1.33.1.2.1.0, type: integer, unit: "", sim: { base: 2 } }            # upsBatteryStatus
      - { name: muc_pin,        label: { vi: "Mức pin còn lại", ja: "バッテリー残量" },
          oid: 1.3.6.1.2.1.33.1.2.4.0, type: integer, unit: "%", sim: { base: 100 } }         # upsEstimatedChargeRemaining
      - { name: dien_ap_pin,    label: { vi: "Điện áp pin", ja: "バッテリー電圧" },
          oid: 1.3.6.1.2.1.33.1.2.5.0, type: integer, scale: 0.1, unit: "V",
          sim: { base: 545.0, noise: 1.5 } }                                                   # upsBatteryVoltage (0,1 V DC)
      - { name: nhiet_do_pin,   label: { vi: "Nhiệt độ pin", ja: "バッテリー温度" },
          oid: 1.3.6.1.2.1.33.1.2.7.0, type: integer, unit: "°C", sim: { base: 25, noise: 1 } } # upsBatteryTemperature
      - { name: dien_ap_vao,    label: { vi: "Điện áp vào", ja: "入力電圧" },
          oid: 1.3.6.1.2.1.33.1.3.3.1.3.1, type: integer, unit: "V", sim: { base: 230, noise: 2 } } # upsInputVoltage pha 1
      - { name: nguon_ra,       label: { vi: "Nguồn ra (3 = lưới, 5 = pin)", ja: "出力電源（3 = 商用、5 = バッテリー）" },
          oid: 1.3.6.1.2.1.33.1.4.1.0, type: integer, unit: "", sim: { base: 3 } }            # upsOutputSource
      - { name: tai_ra,         label: { vi: "Tải đầu ra", ja: "出力負荷率" },
          oid: 1.3.6.1.2.1.33.1.4.4.1.5.1, type: integer, unit: "%", sim: { base: 42, noise: 3 } } # upsOutputPercentLoad

  - name: crah-01                  # điều hòa chính xác (CRAH) của dãy rack, BACnet/IP
    label: { vi: "Điều hòa CRAH 01", ja: "空調機 CRAH 01" }
    system: BMS                    # BMS: hệ thống quản lý tòa nhà (làm mát)
    protocol: bacnet               # collector Python đọc/ghi (Telegraf không đọc BACnet)
    host: 10.20.0.50
    port: 47808                    # cổng chuẩn BACnet/IP (UDP, 0xBAC0)
    device_instance: 5001          # số hiệu thiết bị BACnet — tra màn hình cài đặt / tài liệu tích hợp
    timeout: 3
    points:
      - { name: nhiet_do_cap,   label: { vi: "Nhiệt độ gió cấp", ja: "給気温度" },
          object: "analog-input,1", unit: "°C", sim: { base: 18.0, noise: 0.3 } }
      - { name: nhiet_do_hoi,   label: { vi: "Nhiệt độ gió hồi", ja: "還気温度" },
          object: "analog-input,2", unit: "°C", sim: { base: 28.0, noise: 0.4 } }
      - { name: do_am_hoi,      label: { vi: "Độ ẩm gió hồi", ja: "還気湿度" },
          object: "analog-input,3", unit: "%", sim: { base: 45.0, noise: 2.0 } }
      - { name: trang_thai_quat, label: { vi: "Quạt đang chạy (1 = chạy)", ja: "ファン運転（1 = 運転）" },
          object: "binary-input,1", unit: "", sim: { base: 1 } }
      - { name: diem_dat_nhiet, label: { vi: "Điểm đặt nhiệt độ gió cấp", ja: "給気温度設定値" },
          object: "analog-value,1", unit: "°C", writable: true, min: 16, max: 27, priority: 8,
          sim: { base: 18.0 } }                                  # mức ưu tiên 8: điều khiển tự động (BMS/edge)
      - { name: lenh_chay,      label: { vi: "Lệnh chạy (1) / dừng (0)", ja: "運転（1）／停止（0）指令" },
          object: "binary-value,1", unit: "", writable: true, allowed: [0, 1], priority: 8,
          sim: { base: 1 } }

# =============================================================
#  SƠ ĐỒ DC — tab "Sơ đồ kiến trúc" và "Sơ đồ đơn tuyến" trên trang simulator. Không ảnh hưởng đọc / ghi.
#  system (trên từng thiết bị): EPMS = quản lý điện năng, BMS = quản lý tòa nhà / làm mát.
#  power: sơ đồ đơn tuyến, mỗi nút một phần tử; from = nút cấp điện cho nó (nút gốc không có from)
#    kind:   grid (lưới) | panel (tủ điện) | ups | battery (pin lưu trữ) | load (tải) | cooling (làm mát)
#    device: thiết bị trong Point Map chính là nút này (nhãn lấy theo thiết bị)
#    meters: đồng hồ đo tại nút này (tủ điện); show: điểm hiện trên sơ đồ (mặc định 2 điểm đầu)
#  cooling: thiết bị làm mát -> nút được làm mát
#
#  GIẢ ĐỊNH (assumed: true) — CHƯA có bản vẽ điện thật của site. Sửa theo bản vẽ đơn tuyến của site,
#  rồi đổi assumed: false. Trang sơ đồ hiện cảnh báo "giả định" cho tới khi đó.
# =============================================================
topology:
  assumed: true
  power:
    - { id: luoi, kind: grid, label: { vi: "Lưới điện (trạm biến áp)", ja: "商用電源（受変電）" } }
    - { id: tu-chinh, kind: panel, from: luoi, meters: [dong-ho-dien-01], show: [dien_ap, cong_suat],
        label: { vi: "Tủ phân phối chính (MDB)", ja: "主配電盤（MDB）" } }
    - { id: bess-01, kind: battery, device: bess-01, from: tu-chinh, show: [muc_pin, che_do] }
    - { id: ups-01, kind: ups, device: ups-01, from: tu-chinh, show: [tai_ra, nguon_ra] }
    - { id: tu-rack, kind: panel, from: ups-01, meters: [dong-ho-dien-02], show: [cong_suat],
        label: { vi: "Tủ phân phối rack (PDU)", ja: "ラック分電盤（PDU）" } }
    - { id: day-rack, kind: load, from: tu-rack, label: { vi: "Dãy rack GPU", ja: "GPU ラック列" } }
    - { id: tu-phu, kind: panel, from: tu-chinh, meters: [dong-ho-rs485-03], show: [dien_ap, dong_dien],
        label: { vi: "Tủ phụ cơ điện (làm mát)", ja: "動力副分電盤（空調）" } }
    - { id: crah-01, kind: cooling, device: crah-01, from: tu-phu, show: [nhiet_do_cap, trang_thai_quat] }
  cooling:
    - { device: crah-01, serves: day-rack }

alerts:
  - { point: dong-ho-dien-01.nhiet_do_tu, above: 30.0,
      message: { vi: "Tủ điện quá nóng", ja: "盤内温度が高すぎます" } }
  - { point: bess-01.muc_pin, below: 20.0,
      message: { vi: "Pin sắp cạn", ja: "電池残量が少なくなっています" } }
  - { point: ups-01.nguon_ra, above: 4,
      message: { vi: "UPS đang chạy bằng pin", ja: "UPS がバッテリー運転中です" } }
  - { point: crah-01.nhiet_do_cap, above: 27.0,
      message: { vi: "Gió cấp quá nóng (vượt 27 °C theo ASHRAE)", ja: "給気温度が高すぎます（ASHRAE 推奨 27 °C 超）" } }
