# Telegraf của lab: phần agent + output. Inputs (thiết bị) KHÔNG viết ở đây: collector sinh var/telegraf/devices.conf
# từ Point Map (generate.py, inputs_only) rồi chạy Telegraf với cả hai file:
#   telegraf --config lab-collector.conf --config devices.conf
# Số liệu gửi về collector (trang 8080) qua HTTP thay cho MQTT của edge thật (xem demo A04: telegraf.conf + outputs.mqtt).
# COLLECTOR_URL, TELEGRAF_INTERVAL do collector truyền vào (tools/dashboard/telegraf_source.py).

[agent]
  interval = "${TELEGRAF_INTERVAL}"
  round_interval = true
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "1ms"
  omit_hostname = true

[[outputs.http]]
  url = "${COLLECTOR_URL}"
  method = "POST"
  timeout = "3s"
  data_format = "json"
  json_timestamp_units = "1ms"
